<title>Fortnite AI Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: desktop-app frame — fixed sidebar + scrolling page; stacks to top nav on phones. Single dark look, same as the app. */
:root {
  --bg: #121317; --panel: #1A1C22; --panel-dark: #0E0F12; --hover: #22252D; --border: #2A2D36;
  --text: #E8EAF0; --muted: #8B90A0; --faint: #5C6170;
  --blue: #3B82F6; --purple: #8B5CF6; --green: #22C55E; --amber: #F59E0B;
  --font: "Inter", "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.banner {
  background: linear-gradient(90deg, rgba(59,130,246,.18), rgba(139,92,246,.18));
  border-bottom: 1px solid var(--border); color: #C9D4F5; font-size: 12.5px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.lang-btn { background: var(--hover); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-weight: 600; }
.lang-btn:hover { border-color: var(--blue); }

.app { display: flex; height: calc(100% - 40px); min-height: 560px; }
.sidebar { width: 236px; flex: none; background: var(--panel-dark); padding: 20px 12px 16px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.logo-accent { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--purple); }
.logo { font-size: 19px; font-weight: 700; margin-bottom: 10px; letter-spacing: .5px; }
.section { color: var(--faint); font-size: 10.5px; font-weight: 700; letter-spacing: 1px; padding: 10px 14px 4px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; text-align: start; width: 100%; }
.nav svg { width: 18px; height: 18px; flex: none; stroke: currentColor; }
.nav:hover { background: var(--hover); color: var(--text); }
.nav.active { background: linear-gradient(90deg, rgba(59,130,246,.22), rgba(139,92,246,.10)); color: var(--text); font-weight: 600; }
[dir="rtl"] .nav.active { background: linear-gradient(270deg, rgba(59,130,246,.22), rgba(139,92,246,.10)); }
.nav.active svg { stroke: var(--blue); }
.spacer { flex: 1; min-height: 16px; }
.pill { border-radius: 10px; padding: 7px 10px; font-size: 12px; font-weight: 600; background: var(--hover); color: var(--muted); }

main { flex: 1; min-width: 0; overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
h1 { font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
.dev { background: rgba(139,92,246,.16); color: #C4B5FD; border-radius: 8px; padding: 4px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 14.5px; margin: 0; font-weight: 600; }
.card .csub { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.row { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tiles2 { display: grid; grid-template-columns: repeat(2, minmax(0, 220px)); gap: 16px; }
.tile .bar { width: 28px; height: 4px; border-radius: 2px; }
.tile .label { color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .4px; }
.tile .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .value.empty { font-size: 15px; color: var(--faint); font-weight: 600; }
.tile .hint { color: var(--faint); font-size: 11px; }
.skills { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 10px 24px; }
.skills .v { color: var(--faint); font-size: 11.5px; }
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 20px 8px; }
.empty-state svg { width: 36px; height: 36px; stroke: var(--purple); }
.empty-state b { font-size: 15px; }
.empty-state p { color: var(--muted); margin: 0; max-width: 60ch; }
ul.rubric { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; }
.note { color: var(--faint); font-size: 11.5px; }
.form { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
select { background: var(--panel-dark); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font: inherit; min-width: 180px; }

@media (max-width: 900px) {
  .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row, .row2 { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .app { flex-direction: column; height: auto; }
  .sidebar { width: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 10px 16px; gap: 4px; }
  .logo-accent, .logo, .section, .spacer { display: none; }
  .nav { width: auto; white-space: nowrap; }
  .pill { white-space: nowrap; align-self: center; }
  main { padding: 20px 16px; overflow: visible; }
  .skills { grid-template-columns: 1fr auto; }
  .tiles2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) { main > * { animation: in .25s ease-out both; } }
@keyframes in { from { transform: translateY(4px); } to { transform: none; } }
</style>

<div class="banner"><span id="banner"></span><button class="lang-btn" id="lang" type="button"></button></div>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="page"></main>
</div>

const SECTIONS = [
  ["nav.section.overview", ["dashboard"]],
  ["nav.section.analyze", ["gameplay", "training_sessions"]],
  ["nav.section.skills", ["building", "editing", "piece_control", "aim", "game_sense"]],
  ["nav.section.improve", ["training_plan", "progress", "history"]],
  ["nav.section.app", ["settings"]],
];
const SKILLS = ["building","editing","piece_control","aim","movement","mechanics","game_sense","positioning","decision_making","fight_execution"];
const RUBRIC = { building: 6, editing: 6, piece_control: 6, aim: 5, game_sense: 7 };
const DEV = { gameplay: 4, training_sessions: 4, training_plan: 7, progress: 8, history: 8 };
let lang = "he", current = "dashboard";
try { lang = localStorage.getItem("lang") || "he"; } catch (e) {}
const t = (k, p) => { let s = CAT[lang][k] ?? CAT.en[k] ?? k; if (p) for (const [a, b] of Object.entries(p)) s = s.replace(`{${a}}`, b); return s; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.info}</svg>`;
const empty = (ic, title, text) => `<div class="empty-state">${icon(ic)}<b>${esc(title)}</b><p>${esc(text)}</p></div>`;
const tile = (color, label, value, hint) => `<div class="card tile"><div class="bar" style="background:var(--${color})"></div><div class="label">${esc(label)}</div><div class="value${value == null ? " empty" : ""}">${esc(value ?? t("common.not_enough_data"))}</div>${hint ? `<div class="hint">${esc(hint)}</div>` : ""}</div>`;
const card = (title, sub, body) => `<section class="card"><div><h2>${esc(title)}</h2>${sub ? `<p class="csub">${esc(sub)}</p>` : ""}</div>${body}</section>`;

function renderSidebar() {
  let h = `<div class="logo-accent">AI COACH</div><div class="logo">FORTNITE</div>`;
  for (const [sec, keys] of SECTIONS) {
    h += `<div class="section">${esc(t(sec))}</div>`;
    for (const k of keys) h += `<button type="button" class="nav${k === current ? " active" : ""}" data-k="${k}" title="${esc(t(`page.${k}.subtitle`))}">${icon(k)}<span>${esc(t(`nav.${k}`))}</span></button>`;
  }
  h += `<div class="spacer"></div><div class="pill" title="${esc(t("gemini.status_tip"))}">●&nbsp; ${esc(t("gemini.not_configured"))}</div>`;
  document.getElementById("sidebar").innerHTML = h;
}

function pageBody(k) {
  const nd = t("common.not_enough_data");
  if (k === "dashboard") {
    const skills = SKILLS.map(s => `<span>${esc(t(`skill.${s}`))}</span><span class="v">${esc(nd)}</span>`).join("");
    return `<div class="grid4">${tile("purple", t("dash.overall_rating"), null, t("common.ai_estimate"))}${tile("blue", t("dash.total_sessions"), "0", t("common.measured"))}${tile("green", t("dash.strongest"), null)}${tile("amber", t("dash.weakest"), null)}</div>
      <div class="row">${card(t("dash.skill_ratings"), t("dash.skill_ratings_sub"), `<div class="skills">${skills}</div>`)}${card(t("dash.priorities"), "", empty("training_plan", t("dash.empty_title"), t("dash.priorities_empty")))}</div>
      <div class="row2">${card(t("dash.weekly"), "", empty("progress", nd, t("dash.weekly_empty")))}${card(t("dash.repeated_mistakes"), t("dash.improvements_sub"), empty("info", nd, t("dash.mistakes_empty")))}</div>
      ${card(t("dash.recent"), "", empty("history", t("dash.recent_empty_title"), t("dash.recent_empty")))}`;
  }
  if (RUBRIC[k]) {
    let items = ""; for (let i = 1; i <= RUBRIC[k]; i++) items += `<li>${esc(t(`rubric.${k}.${i}`))}</li>`;
    const nk = `rubric.${k}.note`, note = t(nk) !== nk ? `<div class="note">${esc(t(nk))}</div>` : "";
    return `<div class="tiles2">${tile("purple", t("skillpage.score"), null, t("common.ai_estimate"))}${tile("blue", t("skillpage.sessions"), "0", t("common.measured"))}</div>
      ${card(t("skillpage.rubric"), t("skillpage.rubric_sub"), `<ul class="rubric">${items}</ul>${note}`)}
      ${card(t("skillpage.findings"), "", empty(k, nd, t("skillpage.findings_empty")))}`;
  }
  if (k === "settings") {
    return card(t("settings.language"), "", `<div class="form"><label for="lang-select">${esc(t("settings.language_label"))}</label><select id="lang-select"><option value="he"${lang === "he" ? " selected" : ""}>עברית</option><option value="en"${lang === "en" ? " selected" : ""}>English</option></select></div>`)
      + card(t("settings.gemini"), t("settings.gemini_sub"), `<div class="pill">●&nbsp; ${esc(t("gemini.not_configured"))}</div><div class="note">${esc(t("settings.gemini_pending"))}</div>`);
  }
  return `<section class="card">${empty(k, t(`page.${k}.empty_title`), t(`page.${k}.empty_text`))}</section>`;
}

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.getElementById("banner").textContent = t("preview.banner");
  document.getElementById("lang").textContent = t("preview.lang");
  renderSidebar();
  const dev = DEV[current] ? `<span class="dev" title="${esc(t("common.in_development_tip"))}">${esc(t("common.in_development", { phase: DEV[current] }))}</span>` : "";
  const main = document.getElementById("page");
  main.innerHTML = `<div class="head"><div><h1>${esc(t(`nav.${current}`))}</h1><p class="sub">${esc(t(`page.${current}.subtitle`))}</p></div>${dev}</div>${pageBody(current)}`;
  main.scrollTop = 0;
  const sel = document.getElementById("lang-select");
  if (sel) sel.addEventListener("change", e => setLang(e.target.value));
}
function setLang(l) { lang = l; try { localStorage.setItem("lang", l); } catch (e) {} render(); }
document.getElementById("sidebar").addEventListener("click", e => { const b = e.target.closest(".nav"); if (b) { current = b.dataset.k; render(); } });
document.getElementById("lang").addEventListener("click", () => setLang(lang === "he" ? "en" : "he"));
render();
</script>
