[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fortnite-ai-coach"
version = "0.7.0"
description = "Personal post-session Fortnite AI coach (Windows desktop app)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "google-genai>=1.0",
    "keyring>=25",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.5"]

[project.gui-scripts]
fortnite-ai-coach = "fortnite_coach.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortnite_coach = ["i18n/*.json", "ui/*.qss", "knowledge/*.json", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
